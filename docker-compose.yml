services:
  postgres:
    image: postgres:16
    container_name: officeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: officeflow
      POSTGRES_PASSWORD: officeflow
      POSTGRES_DB: officeflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeflow -d officeflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
